[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-engineering-lab"
version = "0.1.0"
description = "Engineering laboratory for LLM training, fine-tuning, evaluation, inference, and serving."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]